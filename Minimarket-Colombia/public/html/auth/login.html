<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login para accerder al rol deseado">
    <title>Login</title>
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/base/reset.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/base/variables.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/components/navbar.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/components/modal.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/components/footer.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/pages/login.css">
    

    <script src="/Minimarket-Colombia/public/js/auth.js"></script>
</head>


<body>
    <header id="hero">
      <nav class="nav-bar" aria-label="Navegación principal">
        <div class="nav-bar-logo" aria-label="Logo-minimarket">
          <img
            src="/Minimarket-Colombia/public/img/minimarket.jpeg"
            alt="Logo de Minimarket"
            width="50"
            height="50"
          />
        </div>

        <div class="nav-bar-tittle">
          <h2>Minimarket</h2>
        </div>

        <div class="nav-bar-categories">
          <a class="user-categories" href="/Minimarket-Colombia/public/html/pages/categories.html"
            >Categorías</a
          >
          <a class="user-offers" href="/Minimarket-Colombia/public/html/pages/offers.html"
            >Ofertas</a
          >
        </div>

        <section id="search" aria-label="Buscar productos">
          <form class="search-form" role="search">
            <button class="search-button" type="submit" aria-label="Buscar">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="6"></circle>
                <path d="M16 16L21 21"></path>
              </svg>
            </button>

            <input
              class="search-input"
              id="Search-In-Inline"
              type="search"
              name="q"
              placeholder="Buscar productos"
              aria-label="Buscar productos"
              autocorrect="off"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
            />
          </form>
        </section>

        <div class="profile-dropdown">
          <button
            class="profile-toggle"
            type="button"
            aria-label="Seleccionar tipo de perfil"
            aria-expanded="false"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#ffffff"
              stroke-width="1"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
              <path d="M12 10m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
              <path
                d="M6.168 18.849a4 4 0 0 1 3.832 -2.849h4a4 4 0 0 1 3.834 2.855"
              />
            </svg>
          </button>

          <div class="profile-menu" id="profileMenu" role="menu" aria-label="Tipos de perfil">
            <button type="button" class="profile-option selected" data-profile="user" role="menuitem">Usuario</button>
            <button type="button" class="profile-option" data-profile="admin" role="menuitem">Administrador</button>
            <button type="button" class="profile-option" data-profile="worker" role="menuitem">Trabajador</button>
          </div>

          <select name="profile" id="profile" class="sr-only" aria-hidden="true">
            <option value="user" selected>Usuario</option>
            <option value="admin">Administrador</option>
            <option value="worker">Trabajador</option>
          </select>
        </div>
        
        <button class="btn-shopping" id="shopping" type="submit" aria-label="shopping">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#ffffff"
              stroke-width="1"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
              <path d="M17 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
              <path d="M17 17h-11v-14h-2" />
              <path d="M6 5l14 1l-1 7h-13" />
            </svg>
          </button>
      </nav>
    </header>


    <main id="main">
        

        <section class="form-section">

            <h1 class="form-title">Iniciar sesión</h1>

            <p>Bienvenido a Minimarket Colombia.</p>

            <form class="login-form">

              <div class="input-form">
                <label for="gmail">Correo:</label>
                <input type="email" name="gmail" id="gmail" placeholder="Ingresa tu correo" required>

                <label for="password">Contraseña:</label>
                <input type="password" name="password" id="password" placeholder="Ingresa tu contraseña" required>

                <div class="password-toggle">
                  <input type="checkbox" id="showPassword" onclick="viewPassword()">
                  <label for="showPassword">Mostrar Contraseña</label>
                </div>

              </div>
                <button type="submit" id="btn-submit">
                    Ingresar
                </button>

                <div class="forgot-password">
                  <a href="#">¿Olvido la contraseña?</a>
                </div>



            </form>

        </section>

    </main>

    <footer>

    <section class="footer-section">
        
        <h3>Minimarket</h3>

        <div class="footer-section-links">
          <a href="/aboutUS">About us</a>
          <a href="/contact">Contacto</a>
          <a href="/privacidad">Privacidad</a>
          <a href="/terminos">Términos y condiciones</a>
          <a href="/cookies">Cookies</a>

          <p>© 2026 Minimarket Colombia. Todos los derechos reservados</p>
        </div>
      </section>
    </footer>
</body>
</html>
