<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Acá encontraras lo indispensable para tu hogar desde la comondidad de tu hogar"
    />
    <title>Mini market Colombia</title>
    <link
      rel="stylesheet"
      href="/Minimarket-Colombia/public/css/base/reset.css"
    />
    <link
      rel="stylesheet"
      href="/Minimarket-Colombia/public/css/base/variables.css"
    />
    <link
      rel="stylesheet"
      href="/Minimarket-Colombia/public/css/components/cards.css"
    />
    <link
      rel="stylesheet"
      href="/Minimarket-Colombia/public/css/components/footer.css"
    />
    <link
      rel="stylesheet"
      href="/Minimarket-Colombia/public/css/components/modal.css"
    />
    <link
      rel="stylesheet"
      href="/Minimarket-Colombia/public/css/components/navbar.css"
    />
    <link
      rel="stylesheet"
      href="/Minimarket-Colombia/public/css/pages/signup.css"
    />

    <script type="module" src="/Minimarket-Colombia/public/js/auth.js"></script>
  </head>

  <body>
    <header id="hero" role="banner">
      <nav class="nav-bar" aria-label="Navegación principal">
        <div class="nav-bar-logo">
          <img
            src="/Minimarket-Colombia/public/img/minimarket.jpeg"
            alt="Logo de Minimarket"
            width="50"
            height="50"
          />
        </div>

        <div class="nav-bar-tittle">
          <h2>Minimarket</h2>
        </div>

        <div class="nav-bar-categories">
          <a
            class="user-categories"
            href="/Minimarket-Colombia/public/html/pages/categories.html"
            >Categorías</a
          >
          <a
            class="user-offers"
            href="/Minimarket-Colombia/public/html/pages/offers.html"
            >Ofertas</a
          >
        </div>

        <section id="search" aria-label="Buscar productos">
          <form class="search-form" role="search">
            <button class="search-button" type="submit" aria-label="Buscar">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="6"></circle>
                <path d="M16 16L21 21"></path>
              </svg>
            </button>

            <input
              class="search-input"
              id="Search-In-Inline"
              type="search"
              name="q"
              placeholder="Buscar productos"
              aria-label="Buscar productos"
              autocorrect="off"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
            />
          </form>
        </section>

        <div class="profile-dropdown">
          <button
            class="profile-toggle"
            type="button"
            aria-label="Seleccionar tipo de perfil"
            aria-expanded="false"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#ffffff"
              stroke-width="1"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
              <path d="M12 10m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
              <path
                d="M6.168 18.849a4 4 0 0 1 3.832 -2.849h4a4 4 0 0 1 3.834 2.855"
              />
            </svg>
          </button>

          <div class="profile-menu" id="profileMenu" role="menu" aria-label="Tipos de perfil">
            <button type="button" class="profile-option selected" data-profile="user" role="menuitem">Usuario</button>
            <button type="button" class="profile-option" data-profile="admin" role="menuitem">Administrador</button>
            <button type="button" class="profile-option" data-profile="worker" role="menuitem">Trabajador</button>
          </div>

          <select name="profile" id="profile" class="sr-only" aria-hidden="true">
            <option value="user" selected>Usuario</option>
            <option value="admin">Administrador</option>
            <option value="worker">Trabajador</option>
          </select>
        </div>

        <button
          class="btn-shopping"
          id="shopping"
          type="submit"
          aria-label="shopping"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#ffffff"
            stroke-width="1"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
            <path d="M17 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
            <path d="M17 17h-11v-14h-2" />
            <path d="M6 5l14 1l-1 7h-13" />
          </svg>
        </button>
      </nav>
    </header>

    <main class="register-page">
      <section class="register-card">
        <h1>Crear cuenta</h1>
        <p>Únete a Minimarket y empieza a comprar.</p>

        <form class="register-form">
          <div class="profile-tabs-container">
            <span class="label-text">Tipo de perfil</span>

            <div
              class="profile-tabs"
              role="tablist"
              aria-label="Tipo de perfil"
            >
              <button class="tab active" type="button">Cliente</button>
              <button class="tab" type="button">Trabajador</button>
              <button class="tab" type="button">Admin</button>
            </div>
          </div>

          <input type="hidden" id="cliente-id" />

          <div class="form-group">
            <label for="documento">Documento:</label>
            <input
              type="text"
              id="documento"
              class="form-control"
              required
              placeholder="Ejem: 11230223"
            />
          </div>

          <div class="form-group">
            <label for="nombres">Nombres:</label>
            <input type="text" id="nombres" class="form-control" required />
          </div>

          <div class="form-group">
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" class="form-control" required />
          </div>

          <div class="form-group">
            <div class="password-toggle">
              <label for="password">Contraseña:</label>
              <input
                type="password"
                id="password"
                class="form-control"
                required
                placeholder="••••••••"
              />
              <i id="btn" class="btn-toggle-show">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="32"
                  height="32"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#607d8b"
                  stroke-width="1"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
                  <path
                    d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"
                  />
                </svg>
              </i>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirmar Contraseña</label>
            <div class="input-container">
              <input
                type="password"
                id="confirmPassword"
                class="form-control"
                placeholder="••••••••"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="correo">Correo Electrónico:</label>
            <input
              type="email"
              id="correo"
              class="form-control"
              placeholder="Ejem: anonimo@gmail.com"
            />
          </div>

          <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input
              type="text"
              id="telefono"
              class="form-control"
              placeholder="Ejem: +57 31120283423"
            />
          </div>

          <button type="submit" id="btn-submit" class="btn-register">
            Registrar
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12l14 0" />
              <path d="M13 18l6 -6" />
              <path d="M13 6l6 6" />
            </svg>
          </button>

          <div class="card-footer">
            <span>¿Ya tienes cuenta?</span>
            <a href="/Minimarket-Colombia/public/html/auth/login.html"
              >Iniciar Sesión</a
            >
          </div>
        </form>
      </section>
    </main>

    <footer id="form-section">
      <section class="footer-section">
        <h3>Minimarket</h3>

        <div class="footer-section-links">
          <a href="/aboutUS">About us</a>
          <a href="/contact">Contacto</a>
          <a href="/privacidad">Privacidad</a>
          <a href="/terminos">Términos y condiciones</a>
          <a href="/cookies">Cookies</a>

          <p>© 2026 Minimarket Colombia. Todos los derechos reservados</p>
        </div>
      </section>
    </footer>
  </body>
</html>
