<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil - Minimarket</title>
  <link rel="stylesheet" href="../../css/base/reset.css">
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/pages/dashboard.css">
  <script defer src="../../js/pages/profile.js"></script>
</head>
<body>
  <main style="padding:2rem; max-width:720px; margin:auto;">
    <h1>Mi perfil</h1>
    <p id="profile-message" role="status" aria-live="polite"></p>
    <form id="profile-form">
      <label>Nombre <input id="profile-name" name="nombre" required></label>
      <label>Correo <input id="profile-email" name="correo" type="email" required></label>
      <label>Documento <input id="profile-document" name="documento" required></label>
      <label>Teléfono <input id="profile-phone" name="telefono"></label>
      <button type="submit">Guardar cambios</button>
    </form>
    <p><a href="/dashboard">Volver al dashboard</a></p>
  </main>
</body>
</html>
