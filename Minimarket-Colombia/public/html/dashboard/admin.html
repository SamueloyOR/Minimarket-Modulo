<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Acá encontraras lo indispensable para tu hogar desde la comondidad de tu hogar" />
    <title>Mini market Colombia</title>

<body>
    <header class="legend">
        <section class="nav-bar">
            <div class="nav-bar-tittle">
                <h3>Minimarket-Colombia</h3>
            </div>

            <div class="nav-bar-search">

                        <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                        <path d="M21 21l-6 -6" />
                    </svg>
                </i>
                <div class="search-input">
                    <input type="text" name="search-input" id="search-input"
                        placeholder="Buscar empleados, productos, o empleados" />
                </div>

                <div class="nav-bar-bell">
                    <i>
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                            fill="currentColor">
                            <path
                                d="M14.235 19c.865 0 1.322 1.024 .745 1.668a3.992 3.992 0 0 1 -2.98 1.332a3.992 3.992 0 0 1 -2.98 -1.332c-.552 -.616 -.158 -1.579 .634 -1.661l.11 -.006h4.471z" />
                            <path
                                d="M12 2c1.358 0 2.506 .903 2.875 2.141l.046 .171l.008 .043a8.013 8.013 0 0 1 4.024 6.069l.028 .287l.019 .289v2.931l.021 .136a3 3 0 0 0 1.143 1.847l.167 .117l.162 .099c.86 .487 .56 1.766 -.377 1.864l-.116 .006h-16c-1.028 0 -1.387 -1.364 -.493 -1.87a3 3 0 0 0 1.472 -2.063l.021 -.143l.001 -2.97a8 8 0 0 1 3.821 -6.454l.248 -.146l.01 -.043a3.003 3.003 0 0 1 2.562 -2.29l.182 -.017l.176 -.004z" />
                        </svg>
                    </i>
                </div>
                <div class="nav-bar-admin-panel">
                    <div class="admin-profile">
                        <i>
                            <img src="" alt="profile">
                        </i>
                    </div>
                    <div class="admin-name">
                        <h5>Samuel Ospina</h5>
                        <span>admin</span>
                    </div>
                </div>
            </div>
        </section>
    </header>


    <main>
        <section class="dashboard">
            <span>OVERVIEW</span>

            <button class="btn-dashboard" id="btn-dashboard">
                <i>
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                        stroke="#607d8b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M17.8 20l-12 -1.5c-1 -.1 -1.8 -.9 -1.8 -1.9v-9.2c0 -1 .8 -1.8 1.8 -1.9l12 -1.5c1.2 -.1 2.2 .8 2.2 1.9v12.1c0 1.2 -1.1 2.1 -2.2 1.9z" />
                        <path d="M12 5l0 14" />
                        <path d="M4 12l16 0" />
                    </svg>
                </i>
                <span>dashboard</span>
            </button>

            <button class="btn-dashboard" id="btn-dashboard">
                <i>
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                        stroke="#607d8b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M10 9m0 1.105a1.105 1.105 0 0 1 1.105 -1.105h1.79a1.105 1.105 0 0 1 1.105 1.105v9.79a1.105 1.105 0 0 1 -1.105 1.105h-1.79a1.105 1.105 0 0 1 -1.105 -1.105z" />

                        <path d="M5 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                    </svg>

                </i>
                <span>Data</span>
            </button>

            <span>MANAGEMENT</span>

            <button class="btn-products" id="btn-products">
                <i>
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                        stroke="#607d8b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 19v-14a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z" />
                        <path d="M11 17h2" />
                        <path d="M9 12h6" />
                        <path d="M10 7h4" />
                    </svg>

                </i>
                <span>Products</span>
            </button>

            <button class="btn-Orders" id="btn-Orders">
                <i>
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                        stroke="#607d8b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M10 9m0 1.105a1.105 1.105 0 0 1 1.105 -1.105h1.79a1.105 1.105 0 0 1 1.105 1.105v9.79a1.105 1.105 0 0 1 -1.105 1.105h-1.79a1.105 1.105 0 0 1 -1.105 -1.105z" />
                        <path
                            d="M17 3m0 1.105a1.105 1.105 0 0 1 1.105 -1.105h1.79a1.105 1.105 0 0 1 1.105 1.105v15.79a1.105 1.105 0 0 1 -1.105 1.105h-1.79a1.105 1.105 0 0 1 -1.105 -1.105z" />
                        <path d="M5 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                    </svg>

                </i>
                <span>Orders</span>
            </button>

            <button class="btn-Customers" id="btn-Customers">
                <i>
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                        stroke="#607d8b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M10 9m0 1.105a1.105 1.105 0 0 1 1.105 -1.105h1.79a1.105 1.105 0 0 1 1.105 1.105v9.79a1.105 1.105 0 0 1 -1.105 1.105h-1.79a1.105 1.105 0 0 1 -1.105 -1.105z" />
                        <path
                            d="M17 3m0 1.105a1.105 1.105 0 0 1 1.105 -1.105h1.79a1.105 1.105 0 0 1 1.105 1.105v15.79a1.105 1.105 0 0 1 -1.105 1.105h-1.79a1.105 1.105 0 0 1 -1.105 -1.105z" />
                        <path d="M5 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                    </svg>

                </i>
                <span>Customers</span>
            </button>

            <button class="btn-Stores" id="btn-Stores">
                <i>
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                        stroke="#607d8b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M10 9m0 1.105a1.105 1.105 0 0 1 1.105 -1.105h1.79a1.105 1.105 0 0 1 1.105 1.105v9.79a1.105 1.105 0 0 1 -1.105 1.105h-1.79a1.105 1.105 0 0 1 -1.105 -1.105z" />
                        <path
                            d="M17 3m0 1.105a1.105 1.105 0 0 1 1.105 -1.105h1.79a1.105 1.105 0 0 1 1.105 1.105v15.79a1.105 1.105 0 0 1 -1.105 1.105h-1.79a1.105 1.105 0 0 1 -1.105 -1.105z" />
                        <path d="M5 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                    </svg>

                </i>
                <span>Stores</span>
            </button>
        </section>

        <section class="main">
            <div class="tittle">
                <h1>Dashboard Admin</h1>
                <span>Aqui ves lo que ocurre con tus tiendas hoy.</span>

                <form class="calendar">
                    <label for="calendar">last 30 Days</label>
                    <input type="date" id="calendar" name="calendar">
                </form>

                <form class="btn-form">
                    <button class="btn"><span><i>
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                                    fill="none" stroke="#607d8b" stroke-width="1" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" />
                                    <path d="M7 11l5 5l5 -5" />
                                    <path d="M12 4l0 12" />
                                </svg>
                            </i>Export</span></button>
                </form>
            </div>

            <form class="carts-containers">
                <div class="cart-total">
                    <h4>Total Revenue</h4>
                    <i>
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                            stroke="#607d8b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M9.5 3h5a1.5 1.5 0 0 1 1.5 1.5a3.5 3.5 0 0 1 -3.5 3.5h-1a3.5 3.5 0 0 1 -3.5 -3.5a1.5 1.5 0 0 1 1.5 -1.5z" />
                            <path d="M4 17v-1a8 8 0 1 1 16 0v1a4 4 0 0 1 -4 4h-8a4 4 0 0 1 -4 -4z" />
                        </svg>
                    </i>

                </div>
                <div class="cart-orders">
                    <h4>Total orders</h4>
                    <i>

                    </i>
                </div>
                <div class="cart-customers">
                    <h4>Active Customers</h4>
                    <i>
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                            stroke="#607d8b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
                            <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
                            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                            <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" />
                        </svg>

                    </i>
                </div>

                <div class="cart-Alerts">
                    <h4>Pending Alerts</h4>

                </div>
            </form>

        </section>

    </main>

</html>
