<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Meta datos -->

    <meta charset="UTF-8">
    <meta name="description"
        content="Minimarket Colombia, Encontraras lo indespensable para tu hogar desde la comodidad de tu casa">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Market Colombia</title>
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/base/reset.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/base/variables.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/components/footer.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/components/modal.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/components/navbar.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/pages/dashboard.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/pages/login.css">

</head>

<body>
    <header id="hero" role="banner">
        <nav class="nav-bar" aria-label="Navegación principal">
            <div class="nav-bar-logo">
                <img src="/Minimarket-Colombia/public/img/minimarket.jpeg" alt="Logo de Minimarket" width="50"
                    height="50" />
            </div>

            <div class="nav-bar-tittle">
                <h2>Minimarket</h2>
            </div>

            <div class="nav-bar-categories">
                <a class="user-categories" href="/Minimarket-Colombia/public/html/pages/categories.html">Categorías</a>
                <a class="user-offers" href="/Minimarket-Colombia/public/html/pages/offers.html">Ofertas</a>
            </div>

            <section id="search" aria-label="Buscar productos">
                <form class="search-form" role="search">
                    <button class="search-button" type="submit" aria-label="Buscar">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="6"></circle>
                            <path d="M16 16L21 21"></path>
                        </svg>
                    </button>

                    <input class="search-input" id="Search-In-Inline" type="search" name="q"
                        placeholder="Buscar productos" aria-label="Buscar productos" autocorrect="off"
                        autocomplete="off" autocapitalize="off" spellcheck="false" />
                </form>
            </section>

            <button class="btn-login" type="submit" aria-label="login">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
                    <path d="M12 10m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
                    <path d="M6.168 18.849a4 4 0 0 1 3.832 -2.849h4a4 4 0 0 1 3.834 2.855" />
                </svg>
            </button>

            <button class="btn-shopping" id="shopping" type="submit" aria-label="shopping">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                    <path d="M17 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                    <path d="M17 17h-11v-14h-2" />
                    <path d="M6 5l14 1l-1 7h-13" />
                </svg>
            </button>
        </nav>
    </header>

    <main id="principal-content">

        <!-- Formulario para Registrar/Actualizar Cliente -->

        <section class="form__section">


            <h2 class="form-title">Registrar Nuevo Cliente</h2>

            <form id="cliente-form">

                <input type="hidden" id="cliente-id">

                <label for="documento">Documento:</label>
                <input type="text" id="documento" required placeholder="Ejem: 11230223">

                <label for="nombres">Nombres:</label>
                <input type="text" id="nombres" required>

                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>
                <input type="checkbox" onclick="ViewPassword()">Mostrar contraseña

                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" placeholder="Ejem: anonimo@gmail.com">

                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" placeholder="Ejem: 21231244">

                <button type="submit" id="btn-submit">Ingresar</button>
            </form>
        </section>

        <hr>

        <!-- Tabla para Listar Clientes -->
        <section class="table-section">
            <h2>Lista de Clientes</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Documento</th>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                <tbody id="tabla-clientes">

                </tbody>

            </table>
        </section>

        <footer id="footer">
            <div class="footer-container">
                <div class="footer-section">
                    <h3>Mini Market Colombia</h3>
                </div>

                <div class="footer-section">
                    <h4>Todos los derechos reservados</h4>
                    <ul>
                        <li><a href="/privacidad">Privacidad</a></li>
                        <li><a href="/termino">Terminos y condiciones</a></li>
                        <li><a href="/cookies">Cookies</a></li>
                    </ul>
                </div>
            </div>
        </footer>
        </div>

    </main>

    <!-- Script de conexión con la API -->
    <script src="./js/app.js" defer></script>


</body>

</html>
