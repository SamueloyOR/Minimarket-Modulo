<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Minimarket Colombia, encontraras lo indispensable para tu hogar desde la comodidad de tu casa">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Market Colombia</title>
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/base/reset.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/base/variables.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/components/cards.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/components/footer.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/components/modal.css">
    <link rel="stylesheet" href="/Minimarket-Colombia/public/css/pages/dashboard.css">
</head>

<body>
    <header role="banner">
        <nav class="nav-bar">
            <div class="logo">
                <a href="/" aria-label="Minimarket-logo">
                    <img src="/Minimarket-Colombia/public/img/minimarket.jpeg" alt="Logo" width="100" height="100">
                </a>
            </div>

            <p>Minimarket Colombia</p>

            <ul class="nav-links">
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#Servicios">Servicios</a></li>
                <li><a href="#Contacto">Contacto</a></li>
            </ul>
        </nav>

        <h1>Gestión de Clientes</h1>
    </header>

    <main id="principal__content">
        <section class="form__section">
            <h2 id="form__title">Registrar Nuevo Cliente</h2>

            <form id="cliente__form">
                <input type="hidden" id="cliente-id">

                <label for="documento">Documento:</label>
                <input type="text" id="documento" required placeholder="Ejem: 11230223">

                <label for="nombres">Nombres:</label>
                <input type="text" id="nombres" required>

                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>
                <label class="show-password-toggle">
                    <input type="checkbox" onclick="ViewPassword()">
                    Mostrar contraseña
                </label>

                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" placeholder="Ejem: anonimo@gmail.com">

                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" placeholder="Ejem: 21231244">

                <button type="submit" id="btn-submit">Ingresar</button>
            </form>
        </section>

        <hr>

        <section class="table__section">
            <h2>Lista de Clientes</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Documento</th>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla__clientes"></tbody>
            </table>
        </section>

        <footer id="footer">
            <div class="footer__container">
                <div class="footer__section">
                    <h3>Mini Market Colombia</h3>
                </div>

                <div class="footer__section">
                    <h4>Todos los derechos reservados</h4>
                    <ul>
                        <li><a href="/privacidad">Privacidad</a></li>
                        <li><a href="/termino">Terminos y condiciones</a></li>
                        <li><a href="/cookies">Cookies</a></li>
                    </ul>
                </div>
            </div>
        </footer>
    </main>

    <script src="/Minimarket-Colombia/public/js/app.js"></script>
</body>
</html>
