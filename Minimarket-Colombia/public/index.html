<!DOCTYPE html>
<html lang="es">
<head>

    <!-- Meta datos -->

    <meta charset="UTF-8">
    <meta name="description" content="Minimarket Colombia, Encontraras lo indespensable para tu hogar desde la comodidad de tu casa">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Market Colombia</title>
    <link rel="stylesheet" href="css/estilos.css">
    
</head>

<body>
    <div class="container">
        <h1>Gestión de Clientes</h1>

        <!-- Formulario para Registrar/Actualizar Cliente -->
        <section class="form-section">
            <h2 id="form-title">Registrar Nuevo Cliente</h2>
            <form id="cliente-form">
                <input type="hidden" id="cliente-id">
                
                <label for="documento">Documento:</label>
                <input type="text" id="documento" required>

                <label for="nombres">Nombres:</label>
                <input type="text" id="nombres" required>

                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>
                <input type="checkbox" onclick="ViewPassword()"> Mostrar Contraseña

                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo">

                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono">

                <button type="submit" id="btn-guardar">Ingresar</button>
            </form>
        </section>

        <hr>

        <!-- Tabla para Listar Clientes -->
        <section class="table-section">
            <h2>Lista de Clientes</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Documento</th>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                    <tbody id="tabla-clientes">
                        <!-- Los datos se llenarán dinámicamente con JavaScript -->
                    </tbody>
                
            </table>
        </section>
    </div>

    <!-- Script de conexión con la API -->
    <script src="./js/app.js"></script>
    

</body>
</html>
